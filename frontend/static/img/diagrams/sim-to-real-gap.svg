<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="str-title str-desc">
  <title id="str-title">Sim-to-real transfer and the reality gap</title>
  <desc id="str-desc">A policy is trained in simulation across many randomized worlds, then deployed on one real robot. The reality gap between them comes from visual domain shift, dynamics mismatch, actuator differences, sensor noise, and environmental factors. It is bridged by domain randomization, system identification, and domain adaptation.</desc>
  <style>
    .box { fill: #ffffff; stroke: #177245; stroke-width: 2; }
    .box-title { fill: #101613; font: 700 18px 'Space Grotesk', 'Inter', sans-serif; }
    .box-sub { fill: #4b534e; font: 400 13px 'Inter', sans-serif; }
    .box-line { fill: #4b534e; font: 400 12px 'JetBrains Mono', monospace; }
    .arrow { stroke: #177245; stroke-width: 2; fill: none; }
    .arrow-head { fill: #177245; }
    .gap-title { fill: #101613; font: 700 16px 'Space Grotesk', 'Inter', sans-serif; }
    .gap-item { fill: #4b534e; font: 400 13px 'Inter', sans-serif; }
    .bridge { fill: #177245; font: 600 13px 'Inter', sans-serif; }
  </style>
  <defs>
    <marker id="str-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" class="arrow-head" />
    </marker>
  </defs>

  <!-- Figure card: the diagram is drawn on a light card so it reads
       on the site's dark pages and on light pages alike. -->
  <rect x="0" y="0" width="720" height="360" rx="12" fill="#ffffff" stroke="#e3e8e4" />

  <!-- Simulation -> Policy -> Real robot -->
  <path class="arrow" d="M 252 95 L 288 95" marker-end="url(#str-arrow)" />
  <path class="arrow" d="M 432 95 L 468 95" marker-end="url(#str-arrow)" />

  <!-- Simulation box -->
  <rect class="box" x="20" y="40" width="230" height="110" rx="12" />
  <text class="box-title" x="135" y="68" text-anchor="middle">Simulation</text>
  <text class="box-sub" x="135" y="88" text-anchor="middle">many randomized worlds</text>
  <text class="box-line" x="135" y="106" text-anchor="middle">lighting 0.3 to 2.0</text>
  <text class="box-line" x="135" y="122" text-anchor="middle">friction 0.5 to 2.0</text>
  <text class="box-line" x="135" y="138" text-anchor="middle">mass 0.8 to 1.2</text>

  <!-- Policy box -->
  <rect class="box" x="290" y="40" width="140" height="110" rx="12" />
  <text class="box-title" x="360" y="82" text-anchor="middle">Policy</text>
  <text class="box-sub" x="360" y="104" text-anchor="middle">trained in simulation</text>

  <!-- Real robot box -->
  <rect class="box" x="470" y="40" width="230" height="110" rx="12" />
  <text class="box-title" x="585" y="82" text-anchor="middle">Real robot</text>
  <text class="box-sub" x="585" y="104" text-anchor="middle">one physical world</text>

  <!-- Reality gap box -->
  <rect class="box" x="20" y="180" width="680" height="150" rx="12" />
  <text class="gap-title" x="360" y="212" text-anchor="middle">The reality gap</text>
  <text class="gap-item" x="60" y="244">visual domain shift</text>
  <text class="gap-item" x="60" y="266">dynamics mismatch</text>
  <text class="gap-item" x="60" y="288">actuator differences</text>
  <text class="gap-item" x="400" y="244">sensor noise</text>
  <text class="gap-item" x="400" y="266">environmental factors</text>
  <text class="bridge" x="360" y="314" text-anchor="middle">Bridged by domain randomization, system identification, and domain adaptation.</text>
</svg>
